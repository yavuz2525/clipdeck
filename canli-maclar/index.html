<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08492f">
<title>Canlı Maçlar</title>
<style>
:root{--g:#0d6b43;--gd:#08492f;--gs:#eaf6f0;--bg:#f3f5f4;--c:#fff;--t:#17211c;--m:#718078;--b:#dfe6e2;--r:#dc3434;--a:#b87800}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:var(--gd);color:#fff}.topin,.page,footer{max-width:1100px;margin:auto}.topin{height:62px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:9px;align-items:center;font-weight:850;font-size:19px}.ball{width:34px;height:34px;display:grid;place-items:center;background:#fff;color:var(--gd);border-radius:8px}.right{display:flex;align-items:center;gap:10px}.upd{font-size:12px;opacity:.7}.refresh{width:36px;height:36px;border:1px solid #ffffff33;border-radius:8px;background:#ffffff12;color:#fff;font-size:20px}.spin{animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.page{padding:28px 18px 48px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.eye{margin:0 0 5px;color:var(--g);font-size:12px;font-weight:900;letter-spacing:.13em}h1{margin:0;font-size:clamp(28px,4vw,42px);letter-spacing:-.04em}.sub{margin:7px 0 0;color:var(--m)}.stat{min-width:95px;text-align:center;padding:13px;background:#fff;border:1px solid var(--b);border-radius:9px}.stat strong{display:block;font-size:27px}.stat span{font-size:11px;color:var(--m)}.tools{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid var(--b);background:#fff;color:var(--m);border-radius:8px;padding:9px 13px;font-weight:750}.tab.on{background:var(--g);border-color:var(--g);color:#fff}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--r);margin-right:4px}.search{width:min(320px,100%);height:41px;border:1px solid var(--b);border-radius:8px;background:#fff;display:flex;align-items:center;padding:0 11px}.search input{width:100%;border:0;outline:0;background:transparent}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.sum div{display:flex;justify-content:space-between;padding:11px 14px;border:1px solid var(--b);border-radius:8px;background:#fff}.sum span{font-size:12px;color:var(--m);font-weight:700}.notice{padding:12px 14px;margin-bottom:14px;border:1px solid #ebcf70;background:#fff3cd;border-radius:8px;color:#735b00}.hide{display:none!important}.leagues{display:grid;gap:13px}.league{border:1px solid var(--b);border-radius:9px;background:#fff;overflow:hidden}.lh{height:49px;display:flex;align-items:center;gap:9px;padding:0 13px;border-bottom:1px solid var(--b);background:#fbfcfb}.flag{width:24px;height:18px;object-fit:cover}.lm{min-width:0}.ln{font-size:14px;font-weight:850}.lc{font-size:11px;color:var(--m)}.count{margin-left:auto;font-size:11px;color:var(--m)}.match{width:100%;border:0;border-bottom:1px solid #edf1ef;background:#fff;display:grid;grid-template-columns:76px 1fr 165px;text-align:left;padding:0}.match:last-child{border-bottom:0}.match:hover{background:#f8fbf9}.time{display:grid;place-items:center;padding:13px 7px;border-right:1px solid #edf1ef}.time strong{font-size:14px}.status{font-size:9px;font-weight:900;text-transform:uppercase}.live{color:var(--r)}.upcoming{color:var(--a)}.finished{color:var(--m)}.teams{padding:10px 14px;display:grid;gap:6px}.team{display:grid;grid-template-columns:25px 1fr;align-items:center;gap:8px;font-weight:720;font-size:14px}.team img{width:25px;height:25px;object-fit:contain}.side{display:flex;align-items:center;justify-content:flex-end;padding:10px 13px;gap:7px;color:var(--m);font-size:11px}.chip{max-width:125px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--gs);color:var(--gd);padding:5px 7px;border-radius:6px;font-weight:750}.empty{text-align:center;padding:55px;color:var(--m)}dialog{width:min(520px,calc(100% - 26px));border:0;border-radius:12px;padding:0;box-shadow:0 25px 70px #0005}dialog::backdrop{background:#07191099}.close{position:absolute;right:10px;top:10px;width:34px;height:34px;border:0;border-radius:8px;font-size:21px}.mb{padding:27px}.mt{font-size:12px;color:var(--g);font-weight:850}.mteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:16px 0;padding:18px 0;border-block:1px solid var(--b)}.mteam{text-align:center;font-weight:800}.mteam img{display:block;width:55px;height:55px;object-fit:contain;margin:0 auto 7px}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info div{padding:10px;background:var(--bg);border-radius:7px}.info span{display:block;color:var(--m);font-size:10px}.channels{margin-top:15px}.ch{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--b);font-size:12px}.ch span{color:var(--m)}footer{padding:0 18px 25px;text-align:center;font-size:11px;color:var(--m)}@media(max-width:700px){.upd,.sub{display:none}.page{padding:21px 11px 38px}.tools{flex-direction:column;align-items:stretch}.search{width:100%}.tabs{display:grid;grid-template-columns:repeat(4,1fr)}.tab{padding:8px 5px;font-size:11px}.match{grid-template-columns:62px 1fr 42px}.chip{display:none}.side{justify-content:center;padding:7px}.sum div{display:grid;gap:2px;padding:8px}.mb{padding:23px 16px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><span class="ball">⚽</span>Canlı Maçlar</div><div class="right"><span id="updated" class="upd">Veriler yükleniyor…</span><button id="refresh" class="refresh">↻</button></div></div></header>
<main class="page">
<section class="hero"><div><p class="eye">FUTBOL</p><h1>Bugünün Maçları</h1><p class="sub">Canlı, yaklaşan ve tamamlanan karşılaşmaları tek ekranda takip et.</p></div><div class="stat"><strong id="total">—</strong><span>maç</span></div></section>
<section class="tools"><div class="tabs" id="tabs"><button class="tab on" data-s="all">Tümü</button><button class="tab" data-s="live"><i class="dot"></i>Canlı</button><button class="tab" data-s="upcoming">Yaklaşan</button><button class="tab" data-s="finished">Biten</button></div><label class="search"><input id="q" placeholder="Takım veya lig ara"></label></section>
<section class="sum"><div><span>Canlı</span><strong id="nLive">0</strong></div><div><span>Yaklaşan</span><strong id="nUp">0</strong></div><div><span>Biten</span><strong id="nFin">0</strong></div></section>
<div id="err" class="notice hide"></div><div id="leagues" class="leagues"></div><div id="empty" class="empty hide">⚽<h2>Maç bulunamadı</h2></div>
</main>
<dialog id="modal"><button id="close" class="close">×</button><div id="modalBody"></div></dialog>
<footer>Maç verileri CDN Live TV API üzerinden alınır.</footer>
<script>
const API=['https://api.cdnlivetv.is/api/v1/events/sports/soccer/?user=cdnlivetv&plan=free','https://api.cdnlivetv.tv/api/v1/events/sports/soccer/?user=cdnlivetv&plan=free'];
const st={matches:[],status:'all',q:''};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const ns=s=>{s=String(s||'').toLowerCase();return ['live','inplay','in-play','playing'].includes(s)?'live':['finished','ended','ft','final'].includes(s)?'finished':'upcoming'};
const label={live:'Canlı',upcoming:'Yaklaşan',finished:'Bitti'};
function fb(n){let t=encodeURIComponent(String(n||'?').trim().slice(0,2).toUpperCase());return `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='64' height='64'%3E%3Crect width='64' height='64' rx='12' fill='%23eaf6f0'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Arial' font-size='22' font-weight='700' fill='%23084c32'%3E${t}%3C/text%3E%3C/svg%3E`}
function image(u,n){let f=fb(n);return `<img src="${u?esc(u):f}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${f}'">`}
function normal(raw){let r=raw?.['cdnlivetv.is']||raw?.['cdnlivetv.tv']||raw||{},a=Array.isArray(r.Soccer)?r.Soccer:[];return a.map(m=>({id:m.gameID||`${m.homeTeam}-${m.awayTeam}-${m.start}`,homeTeam:m.homeTeam||'Ev Sahibi',awayTeam:m.awayTeam||'Deplasman',homeTeamIMG:m.homeTeamIMG||'',awayTeamIMG:m.awayTeamIMG||'',time:m.time||'',tournament:m.tournament||'Diğer',country:m.country||'',countryIMG:m.countryIMG||'',status:m.status||'upcoming',start:m.start||'',channels:Array.isArray(m.channels)?m.channels.map(c=>({name:c.channel_name||c.name||'Kanal',code:c.channel_code||c.code||'',viewers:c.viewers||'0'})):[]}))}
async function getData(){let e;for(const u of API){try{let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('API '+r.status);return normal(await r.json())}catch(x){e=x}}throw e||Error('Veri alınamadı')}
function list(){let q=st.q.trim().toLocaleLowerCase('tr-TR');return st.matches.filter(m=>(st.status==='all'||ns(m.status)===st.status)&&(!q||`${m.homeTeam} ${m.awayTeam} ${m.tournament} ${m.country}`.toLocaleLowerCase('tr-TR').includes(q)))}
function render(){let c={live:0,upcoming:0,finished:0};st.matches.forEach(m=>c[ns(m.status)]++);$('total').textContent=st.matches.length;$('nLive').textContent=c.live;$('nUp').textContent=c.upcoming;$('nFin').textContent=c.finished;let a=list();$('empty').classList.toggle('hide',a.length>0);let map=new Map;for(const m of a){let k=`${m.country||'Diğer'}|||${m.tournament||'Diğer'}`;(map.get(k)||map.set(k,[]).get(k)).push(m)}let groups=[...map.entries()].sort((x,y)=>Number(y[1].some(m=>ns(m.status)==='live'))-Number(x[1].some(m=>ns(m.status)==='live'))||x[0].localeCompare(y[0],'tr'));$('leagues').innerHTML=groups.map(([k,ms])=>{let [country,tournament]=k.split('|||'),flag=ms.find(m=>m.countryIMG)?.countryIMG||'';return `<section class="league"><div class="lh">${flag?`<img class="flag" src="${esc(flag)}">`:'⚽'}<div class="lm"><div class="ln">${esc(tournament)}</div><div class="lc">${esc(country)}</div></div><div class="count">${ms.length} maç</div></div>${ms.map(m=>{let s=ns(m.status),ch=m.channels?.[0]?.name||'';return `<button class="match" data-id="${esc(m.id)}"><div class="time"><strong>${esc(m.time||'--:--')}</strong><span class="status ${s}">${label[s]}</span></div><div class="teams"><div class="team">${image(m.homeTeamIMG,m.homeTeam)}<span>${esc(m.homeTeam)}</span></div><div class="team">${image(m.awayTeamIMG,m.awayTeam)}<span>${esc(m.awayTeam)}</span></div></div><div class="side">${ch?`<span class="chip">${esc(ch)}</span>`:''}<b>›</b></div></button>`}).join('')}</section>`}).join('')}
function openMatch(id){let m=st.matches.find(x=>String(x.id)===String(id));if(!m)return;let s=ns(m.status);$('modalBody').innerHTML=`<div class="mb"><div class="mt">${esc(m.country)} · ${esc(m.tournament)}</div><h2>Maç Detayı</h2><div class="mteams"><div class="mteam">${image(m.homeTeamIMG,m.homeTeam)}${esc(m.homeTeam)}</div><b>VS</b><div class="mteam">${image(m.awayTeamIMG,m.awayTeam)}${esc(m.awayTeam)}</div></div><div class="info"><div><span>Saat</span><strong>${esc(m.time||'--:--')}</strong></div><div><span>Durum</span><strong>${label[s]}</strong></div><div><span>Başlangıç</span><strong>${esc(m.start||'—')}</strong></div><div><span>Maç ID</span><strong>${esc(m.id)}</strong></div></div><div class="channels"><h3>Yayınlayan kanallar</h3>${m.channels.length?m.channels.map(c=>`<div class="ch"><strong>${esc(c.name)}</strong><span>${esc(c.code.toUpperCase())}${c.viewers!=='0'?` · ${esc(c.viewers)} izleyici`:''}</span></div>`).join(''):'<div class="ch">Yayın kanalı bilgisi yok.</div>'}</div></div>`;$('modal').showModal()}
async function load(){let b=$('refresh');b.classList.add('spin');$('err').classList.add('hide');try{st.matches=await getData();$('updated').textContent='Son güncelleme: '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});render()}catch(e){st.matches=[];$('err').textContent=(e.message||'Veri alınamadı')+'. API tarayıcı isteğini engelliyor veya geçici olarak erişilemiyor olabilir.';$('err').classList.remove('hide');render()}finally{b.classList.remove('spin')}}
$('tabs').onclick=e=>{let b=e.target.closest('[data-s]');if(!b)return;st.status=b.dataset.s;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()};$('q').oninput=e=>{st.q=e.target.value;render()};$('leagues').onclick=e=>{let b=e.target.closest('[data-id]');if(b)openMatch(b.dataset.id)};$('refresh').onclick=load;$('close').onclick=()=>$('modal').close();$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').close()};load();setInterval(load,60000);
</script>
</body>
</html>
